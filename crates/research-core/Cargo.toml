[package]
name = "jlens-research"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Amirhossein Ghanipour"]
repository = "https://github.com/amirhosseinghanipour/jacobian-lens"
description = "Auditable CPU reference algorithms for Jacobian lens research"
readme = "README.md"
documentation = "https://docs.rs/jlens-research"
keywords = ["interpretability", "jacobian", "machine-learning"]
categories = ["science", "mathematics"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
nalgebra = { version = "=0.33.3", features = ["serde-serialize"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
tempfile = "=3.26.0"
