[package]
name = "jlens-research"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Auditable CPU reference algorithms for Jacobian lens research"

[dependencies]
nalgebra = { version = "=0.33.3", features = ["serde-serialize"] }
serde = { version = "=1.0.228", features = ["derive"] }
