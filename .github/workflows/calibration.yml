name: Qwen calibration experiment
on:
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/download_qwen.py --revision 7ae557604adf67be50417f59c2c2f167def9a775
      - run: pip install pyarrow huggingface-hub==0.30.2 tokenizers==0.22.2
      - run: python scripts/prepare_calibration.py models/Qwen2.5-0.5B-Instruct/tokenizer.json calibration-data
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-corpus
          path: calibration-data
          retention-days: 90
