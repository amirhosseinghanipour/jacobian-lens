name: Vendor Rust dependencies
on:
  workflow_dispatch:
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo vendor /tmp/vendor
      - run: tar -C /tmp -czf /tmp/vendor.tar.gz vendor
      - uses: actions/upload-artifact@v4
        with:
          name: rust-vendor
          path: |
            /tmp/vendor.tar.gz
            Cargo.lock
          retention-days: 7
